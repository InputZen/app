name: Deploy to cPanel (FTP)

on:
  push:
    branches: [master, main]
  # lets the keyboards repo trigger a rebuild when definitions change
  repository_dispatch:
    types: [definition_update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Same layout as locally: via-app and via-keyboards side by side
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: via-app

      - name: Checkout keyboards definitions
        uses: actions/checkout@v4
        with:
          repository: kiwikey/via-keyboards
          path: via-keyboards

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install keyboards deps
        working-directory: via-keyboards
        run: npm install

      - name: Install app deps
        working-directory: via-app
        run: npm install

      - name: Build definitions
        working-directory: via-app
        run: npm run build:kbs

      - name: Type-check and build
        working-directory: via-app
        run: |
          npx tsc
          npx vite build

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: via-app/dist/
          server-dir: ${{ secrets.FTP_DIR }}
