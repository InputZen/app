name: Deploy to cPanel (FTP)

on:
  push:
    branches: [via-app-buildbox]
  # also started by the keyboards repo when definitions change,
  # and manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    # Only the via-app-buildbox branch may publish, even for manual runs.
    # If this file is merged into main or another branch, it still won't deploy from there.
    if: github.ref == 'refs/heads/via-app-buildbox'
    runs-on: ubuntu-latest
    steps:
      # Same layout as locally: via-app and via-keyboards side by side
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: via-app

      - name: Checkout keyboards definitions
        uses: actions/checkout@v4
        with:
          repository: kiwikey/via-keyboards
          ref: via-keyboards-buildbox
          path: via-keyboards

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install keyboards deps
        working-directory: via-keyboards
        run: npm install

      - name: Install app deps
        working-directory: via-app
        run: npm install

      - name: Build definitions
        working-directory: via-app
        run: npm run build:kbs

      - name: Type-check and build
        working-directory: via-app
        env:
          VITE_BASE: /via_buildbox/
        run: |
          npx tsc
          npx vite build

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BUILDBOX_FTP_SERVER }}
          username: ${{ secrets.BUILDBOX_FTP_USERNAME }}
          password: ${{ secrets.BUILDBOX_FTP_PASSWORD }}
          protocol: ftps
          local-dir: via-app/dist/
          server-dir: ${{ secrets.BUILDBOX_FTP_DIR }}
